openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: openai
    description: OpenAI AI chat and audio operations
  - name: handbook
    description: Handbook document operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /openai/conversations:
    get:
      operationId: listOpenaiConversations
      tags: [openai]
      summary: List all conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiConversation"
    post:
      operationId: createOpenaiConversation
      tags: [openai]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiConversationInput"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversation"

  /openai/conversations/{id}:
    get:
      operationId: getOpenaiConversation
      tags: [openai]
      summary: Get conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
    patch:
      operationId: updateOpenaiConversation
      tags: [openai]
      summary: Rename a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiConversationUpdate"
      responses:
        "200":
          description: Updated conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversation"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
    delete:
      operationId: deleteOpenaiConversation
      tags: [openai]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"

  /openai/conversations/{id}/messages:
    get:
      operationId: listOpenaiMessages
      tags: [openai]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiMessage"
    post:
      operationId: sendOpenaiMessage
      tags: [openai]
      summary: Send a text message and receive a streaming text response
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiMessageInput"
      responses:
        "200":
          description: SSE stream of assistant text chunks
          content:
            text/event-stream: {}

  /handbook/status:
    get:
      operationId: getHandbookStatus
      tags: [handbook]
      summary: Get handbook freshness status
      description: Returns when the handbook was last fetched and its section count
      responses:
        "200":
          description: Handbook status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HandbookStatus"

  /handbook/refresh:
    post:
      operationId: refreshHandbook
      tags: [handbook]
      summary: Force refresh the handbook from Google Docs
      responses:
        "200":
          description: Refreshed handbook status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HandbookStatus"

  /openai/conversations/{id}/realtime/session:
    post:
      operationId: createOpenaiRealtimeSession
      tags: [openai]
      summary: Mint a Realtime API ephemeral session token
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Ephemeral session minted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiRealtimeSession"
        "404":
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
        "500":
          description: OpenAI session mint failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"

  /openai/conversations/{id}/realtime/transcript:
    post:
      operationId: persistOpenaiRealtimeTranscript
      tags: [openai]
      summary: Persist a completed realtime turn
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiRealtimeTranscriptInput"
      responses:
        "201":
          description: Turn persisted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiRealtimeTranscriptResult"
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
        "404":
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"

  /openai/handbook/lookup:
    post:
      operationId: lookupHandbookSection
      tags: [openai]
      summary: Look up the most relevant handbook section for a query
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HandbookLookupInput"
      responses:
        "200":
          description: Best-matching section or empty result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HandbookLookupResult"
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    OpenaiConversation:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - createdAt
        - updatedAt

    OpenaiConversationInput:
      type: object
      properties:
        title:
          type: string
      required:
        - title

    OpenaiConversationUpdate:
      type: object
      properties:
        title:
          type: string
      required:
        - title

    OpenaiConversationWithMessages:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: "#/components/schemas/OpenaiMessage"
      required:
        - id
        - title
        - createdAt
        - updatedAt
        - messages

    OpenaiMessage:
      type: object
      properties:
        id:
          type: integer
        conversationId:
          type: integer
        role:
          type: string
        content:
          type: string
        citation:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - conversationId
        - role
        - content
        - citation
        - createdAt

    OpenaiMessageInput:
      type: object
      properties:
        content:
          type: string
      required:
        - content

    HandbookStatus:
      type: object
      properties:
        lastFetchedAt:
          type: ["string", "null"]
          format: date-time
        sectionCount:
          type: integer
        documentTitle:
          type: ["string", "null"]
        isLoaded:
          type: boolean
      required:
        - lastFetchedAt
        - sectionCount
        - documentTitle
        - isLoaded

    OpenaiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    OpenaiRealtimeSession:
      type: object
      properties:
        ephemeralKey:
          type: string
        sessionId:
          type: string
        model:
          type: string
        expiresAt:
          type: integer
          description: Unix epoch seconds when the token expires
      required:
        - ephemeralKey
        - sessionId
        - model
        - expiresAt

    OpenaiRealtimeTranscriptInput:
      type: object
      properties:
        userText:
          type: string
          minLength: 1
        assistantText:
          type: string
          minLength: 1
        citation:
          type: ["string", "null"]
      required:
        - userText
        - assistantText
        - citation

    OpenaiRealtimeTranscriptResult:
      type: object
      properties:
        userMessageId:
          type: integer
        assistantMessageId:
          type: integer
      required:
        - userMessageId
        - assistantMessageId

    HandbookLookupInput:
      type: object
      properties:
        query:
          type: string
          minLength: 1
      required:
        - query

    HandbookLookupResult:
      type: object
      properties:
        heading:
          type: ["string", "null"]
        content:
          type: string
      required:
        - heading
        - content
